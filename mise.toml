[settings.python]
uv_venv_auto = true

[tools]
python = "3.15.2"
uv = "0.13.7"

[env]
SEC_USER_AGENT = "equity-analysis research bot"

[tasks.install]
description = "Install all workspace packages and dependencies from the lockfile"
alias = "i"
run = "uv sync --all-packages --locked"

[tasks.fix]
description = "Lint & format all .py files"
alias = "f"
run = [
    "uv run ruff format . --config pyproject.toml",
    "uv run ruff check . --fix --unsafe-fixes --config pyproject.toml",
]

[tasks.mypy]
description = "Type check the entire codebase with mypy"
alias = "m"
run = "uv run mypy ."

[tasks.check]
description = "Every check CI runs, except the end-to-end backtests of check:e2e"
alias = "c"
run = [
    "uv run ruff check . --no-fix",
    "uv run ruff format --check .",
    "uv run mypy .",
    "uv run pytest -q -m 'not e2e'",
]

[tasks."check:e2e"]
description = "Run the end-to-end backtests that check leaves out"
run = "uv run pytest -q -m e2e"

[tasks."ledger:publish"]
description = "Score the demo universe on real data and append it to ledger/. Needs TIINGO_API_KEY"
run = "scripts/publish-ledger.sh"

[tasks.cli]
description = "Run the eq command-line interface"
run = "uv run eq"
